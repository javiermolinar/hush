[tools]
go = "1.27.4"
node = "22.23.5"

[tasks.setup]
description = "Install npm dependencies from the lockfile"
run = "npm ci --ignore-scripts"

[tasks.build]
description = "Compile the workspace and build the development CLI/TUI at bin/hush"
run = [
  "npm run build",
  "npm run backend:bundle",
  "go build ./sdk/... ./tui/... ./app/...",
  "go build -o bin/hush ./app/cmd/hush",
]

[tasks.test]
description = "Vet Go and run workspace tests, including local backend fixtures"
depends = ["build"]
run = [
  "go vet ./sdk/... ./tui/... ./app/...",
  'HUSH_TEST_BACKEND="$PWD/dist/hush-backend.mjs" go test ./sdk/... ./tui/... ./app/...',
  "npm run protocol:check",
  "npm run profile:check",
  # Test the already-built server, backend and CLI serially to avoid timing contention.
  "node --test --test-concurrency=1 server/test/*.test.mjs backend/test/*.test.mjs app/test/*.test.mjs",
]

[tasks."test:race"]
description = "Run the short Go suites with the race detector"
depends = ["build"]
run = 'HUSH_TEST_BACKEND="$PWD/dist/hush-backend.mjs" go test -race -short ./sdk/... ./tui/... ./app/...'

[tasks."release:build"]
description = "Build the installable hush with its embedded backend (without verification)"
run = "sh app/release.sh build"

[tasks.release]
description = "Build and verify the installable hush on the minimum supported Node version"
tools.node = "22.19.0"
run = "sh app/release.sh verify"
