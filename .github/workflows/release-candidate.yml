name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  build:
    name: Verify (${{ matrix.target }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12 # renovate: jdx/mise
          cache: false
      - name: Build and verify with the minimum supported Node
        run: mise run release
      - name: Package binary and checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="hush-$TARGET.tar.gz"
          tar -czf "$archive" -C "dist/release/$TARGET" hush
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hush-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            hush-${{ matrix.target }}.tar.gz
            hush-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
