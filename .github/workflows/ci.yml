name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-24.04
          - os: macOS
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12 # renovate: jdx/mise
      - name: Check Go formatting and SDK schema copies
        if: runner.os == 'Linux'
        run: |
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          go generate ./sdk
          changes=$(git status --short --untracked-files=all -- sdk/internal/)
          if [[ -n "$changes" ]]; then
            printf 'Run go generate ./sdk and commit the schema copies:\n%s\n' "$changes" >&2
            exit 1
          fi
      - name: Install npm dependencies
        run: mise run setup
      - name: Build, vet and test the workspace
        env:
          # Keep other Go test binaries from competing with the TUI frame-budget tests.
          GOFLAGS: -mod=readonly -p=1
        run: mise run test
      - name: Run short Go tests with the race detector
        run: mise run --skip-deps test:race
      - name: Verify the installable binary at minimum Node
        if: runner.os == 'Linux'
        run: mise run release
