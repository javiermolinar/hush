name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  repository:
    name: Repository security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12 # renovate: jdx/mise
          mise_env: security
      - name: Scan reachable Git history for secrets
        run: gitleaks git --redact=100 --verbose --no-banner --ignore-gitleaks-allow --log-opts=--all .
      - name: Check GitHub Actions syntax
        run: actionlint
      - name: Audit workflow security
        run: zizmor --offline --strict-collection --format=github .github/

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12 # renovate: jdx/mise
          mise_env: security
      - name: Check npm lockfile for high and critical advisories
        run: npm audit --audit-level=high
      - name: Check reachable Go vulnerabilities
        # govulncheck needs a go.mod in its working directory, even in a workspace.
        working-directory: app
        run: govulncheck ./... ../sdk/... ../tui/...
